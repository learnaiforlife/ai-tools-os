<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>AI Tools OS</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg" />
<style>
  /* glass surface variant */
  [data-surface="glass"] .card,
  [data-surface="glass"] .sidebar,
  [data-surface="glass"] .topbar,
  [data-surface="glass"] .statusbar { backdrop-filter: blur(14px) saturate(1.2); }
  [data-surface="glass"] .card { background: rgba(24,26,33,0.72); }
  [data-surface="glass"] .sidebar { background: rgba(18,19,25,0.78); }
  [data-surface="glass"] .topbar, [data-surface="glass"] .statusbar { background: rgba(18,19,25,0.72); }
  [data-surface="glass"] .main { background: radial-gradient(1100px 580px at 78% -8%, rgba(43,212,160,0.07), transparent 58%), radial-gradient(900px 500px at 10% 110%, rgba(91,157,255,0.05), transparent 60%), var(--bg-0); }
  [data-theme="light"][data-surface="glass"] .card { background: rgba(255,255,255,0.72); }
  [data-theme="light"][data-surface="glass"] .sidebar { background: rgba(255,255,255,0.8); }
  [data-theme="light"][data-surface="glass"] .topbar, [data-theme="light"][data-surface="glass"] .statusbar { background: rgba(255,255,255,0.74); }
  [data-theme="light"][data-surface="glass"] .main { background: radial-gradient(1100px 580px at 78% -8%, rgba(43,212,160,0.09), transparent 58%), radial-gradient(900px 500px at 10% 110%, rgba(91,157,255,0.07), transparent 60%), var(--bg-0); }
  /* muted risk colors */
  [data-risk="muted"] { --r-low: #6f7e95; --r-med: #b89a5e; --r-high: #c07b54; --r-crit: #c85f6b; }
  .loading-splash { position: fixed; inset: 0; display: grid; place-items: center; background: var(--bg-0); z-index: 999; }
</style>
</head>
<body>
<div id="root"><div class="loading-splash"><div class="brand-mark" style="width:38px;height:38px;border-radius:10px;"></div></div></div>
<script type="module" src="/src/main.jsx"></script>
</body>
</html>

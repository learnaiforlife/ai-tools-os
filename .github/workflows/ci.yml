name: Validate AIOS
on: [push, pull_request]
permissions:
  contents: read
concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, macos-15-intel]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm --prefix site ci
      - run: npm run check
      - run: npm run test:desktop
      - run: npm run test:conversion
      - run: npm run test:labs:desktop
      - run: npm audit --audit-level=moderate
      - run: npm --prefix site audit --audit-level=moderate
      - run: npm run dist:mac:local
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: desktop-test-results-${{ matrix.runner }}
          path: test-results/
